# Always combine with docker-compose.yml through scripts/preview-compose.sh.
services:
  postgres:
    environment:
      POSTGRES_DB: wordle_preview
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d wordle_preview"]
  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wordle_preview
      SERVER_FORWARD_HEADERS_STRATEGY: framework
  frontend:
    volumes:
      - ./deploy/nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
# Project-scoped: never the production volume or an external database.
volumes:
  postgres-data:
    labels:
      purpose: disposable-wordle-preview
