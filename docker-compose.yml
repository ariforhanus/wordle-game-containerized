services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database administrator password}
      POSTGRES_DB: PGDatabase
      WORDLE_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set a unique application database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-wordle.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d PGDatabase"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/PGDatabase
      SPRING_DATASOURCE_USERNAME: wordle
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set application database password}
      JWT_SECRET: ${JWT_SECRET:?Set at least 32 bytes of random signing material}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8091/actuator/health/readiness]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  frontend:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    # Local development only. Production ingress uses the internal service port.
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ingress:
    image: caddy:2-alpine
    profiles: [production]
    environment:
      WORDLE_DOMAIN: ${WORDLE_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
