services:
  postgres:
      image: "postgres:17.4"
      container_name: postgres
      hostname: "postgres"
      volumes:
          - ./.docker/postgres:/var/lib/postgresql/data
      healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres -d PGDatabase"]
          interval: 5s
          timeout: 3s
          retries: 10
      ports:
          - "5433:5432"
      environment:
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "admin@1234"
          POSTGRES_DB: "PGDatabase"
          ACCEPT_EULA: "Y"
      restart: unless-stopped



  backend:
      build:
          context: ./backend
          dockerfile: Dockerfile
      image: wordle-game-backend:latest
      container_name: wordle-backend
      depends_on:
          postgres:
              condition: service_healthy
      ports:
          - "8091:8091"
      environment:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/PGDatabase
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin@1234
      restart: unless-stopped

  frontend:
      build:
          context: ./frontend
          dockerfile: Dockerfile
      image: wordle-game-frontend:latest
      container_name: wordle-frontend
      depends_on:
          - backend
      ports:
          - "80:80"
      volumes:
          - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      restart: unless-stopped

  pgadmin:
      image: "dpage/pgadmin4:9.4.0"
      container_name: pgadmin
      depends_on: 
          - postgres
      environment:
          PGADMIN_DEFAULT_EMAIL: postgres@pgadmin.org
          PGADMIN_DEFAULT_PASSWORD: admin
          PGADMIN_CONFIG_SERVER_MODE: 'False'

          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "admin@1234"

      volumes:
          - ./.docker/pgadmin:/root/.pgadmin

      ports:
          - "5050:80"
      restart: unless-stopped

networks:
  default: 
    name: wordle-net