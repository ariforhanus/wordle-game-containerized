groups:
  - name: wordle
    rules:
      - alert: WordleBackendUnavailable
        expr: up{job="wordle"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Wordle backend metrics unavailable"}
      - alert: WordleHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="wordle",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="wordle"}[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Wordle HTTP error rate exceeds 5%"}
      - alert: WordleHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="wordle"}[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Wordle p95 latency exceeds one second"}
