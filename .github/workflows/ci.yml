name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.4
        env: {POSTGRES_DB: wordle_test, POSTGRES_PASSWORD: local-test-only}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d wordle_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/wordle_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
        working-directory: backend
      - name: Operator-script failure tests
        run: python -m unittest discover -s tests/ops -v
      - name: Preview startup failure and repeat-start tests
        run: python -m unittest discover -s tests/preview -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: backend-coverage, path: backend/target/site/jacoco, retention-days: 7}
      - name: Rehearse database backup and isolated restore
        run: |
          docker cp deploy/backup.sh "${{ job.services.postgres.id }}:/tmp/backup.sh"
          docker cp deploy/restore-check.sh "${{ job.services.postgres.id }}:/tmp/restore-check.sh"
          docker exec -e PGHOST=localhost -e PGUSER=postgres -e PGDATABASE=wordle_test -e PGPASSWORD=local-test-only -e BACKUP_DIR=/tmp/backups "${{ job.services.postgres.id }}" sh /tmp/backup.sh
          docker exec -e PGHOST=localhost -e PGUSER=postgres -e PGDATABASE=wordle_test -e PGPASSWORD=local-test-only -e RESTORE_TEST_DATABASE=wordle_restore_ci "${{ job.services.postgres.id }}" sh -c 'set -- /tmp/backups/*.dump; sh /tmp/restore-check.sh "$1"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: backend-jar, path: backend/target/wordle-0.0.1-SNAPSHOT.jar, retention-days: 3}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm}
      - name: Test local environment setup
        run: node --test tests/ops/setup-local-env.test.mjs
      - run: npm ci
      - run: npm run test:coverage -w @wordle/web
      - run: npm run test:production -w @wordle/web
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: frontend-coverage, path: packages/web/coverage, retention-days: 7}
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.4
        env: {POSTGRES_DB: wordle_browser, POSTGRES_PASSWORD: local-test-only}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d wordle_browser"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/wordle_browser
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: local-test-only
      JWT_SECRET: browser-test-only-signing-material-123456789
      CORS_ORIGINS: http://localhost:18080
      MAIL_ENABLED: 'true'
      SMTP_HOST: localhost
      SMTP_PORT: '2525'
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      PUBLIC_URL: http://localhost:18080
      E2E_BASE_URL: http://localhost:18080
      E2E_PRODUCTION: 'true'
      APP_AUTH_RATE_LIMIT_ENABLED: 'false' # Account limits have separate PostgreSQL-backed tests.
      E2E_SMTP_CAPTURE_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/web
      - run: mvn -B package -DskipTests
        working-directory: backend
      - name: Start local SMTP fixture
        run: node tests/fixtures/smtp.mjs > /tmp/wordle-smtp.log 2>&1 &
      - name: Start backend
        run: java -jar backend/target/wordle-0.0.1-SNAPSHOT.jar > /tmp/wordle-e2e.log 2>&1 &
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9091/actuator/health/readiness; then exit 0; fi
            sleep 1
          done
          cat /tmp/wordle-e2e.log
          exit 1
      - name: Build and serve release frontend through production Nginx
        run: |
          npm run build
          docker build -f tests/e2e/Dockerfile -t wordle-e2e:ci .
          docker run -d --name wordle-e2e --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --add-host backend:host-gateway -p 127.0.0.1:18080:8080 wordle-e2e:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs wordle-e2e
          exit 1
      - run: npm run e2e -w @wordle/web
      - name: Clean up browser server
        if: always()
        run: docker rm -f wordle-e2e || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: {name: browser-failures, path: packages/web/test-results, retention-days: 3}
  security:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t wordle-backend:ci backend
      - run: docker build -f packages/web/Dockerfile -t wordle-frontend:ci .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wordle-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wordle-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fresh preview startup and application smoke test
        run: |
          ./scripts/start-preview.sh
          ./scripts/smoke-preview.sh --full
      - name: Restart and repeated startup preserve data and secrets
        run: |
          cp .preview/secrets.env .preview/secrets.expected
          ./scripts/preview-compose.sh exec -T postgres psql -U postgres -d wordle_preview -v ON_ERROR_STOP=1 -c "CREATE TABLE preview_restart_probe (value text); INSERT INTO preview_restart_probe VALUES ('preserved');"
          ./scripts/preview-compose.sh stop
          ./scripts/start-preview.sh
          ./scripts/start-preview.sh
          cmp .preview/secrets.env .preview/secrets.expected
          ./scripts/preview-compose.sh exec -T postgres psql -U postgres -d wordle_preview -Atc "SELECT value FROM preview_restart_probe" | grep -qx preserved
      - name: Preview diagnostics
        if: failure()
        run: |
          ./scripts/preview-compose.sh ps
          ./scripts/preview-compose.sh logs --tail=100
