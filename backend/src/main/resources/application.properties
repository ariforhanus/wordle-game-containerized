spring.application.name=wordle

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/PGDatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=8091
server.error.include-message=always
server.error.include-exception=false
server.error.include-stacktrace=never

# JWT
jwt.secret=${JWT_SECRET:changeme-in-production}
jwt.expiration=7200000

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=512KB

# Application
app.timezone=Europe/Istanbul
