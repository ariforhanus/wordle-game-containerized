spring.application.name=wordle
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/PGDatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wordle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
server.port=8091
# The application uses the socket peer for abuse controls. Enable proxy trust only
# after validating a deployment-specific trusted-hop configuration.
server.forward-headers-strategy=NONE
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=520KB
app.timezone=Europe/Istanbul
app.cors-origins=${CORS_ORIGINS:}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:wordle@localhost}
app.public-url=${PUBLIC_URL:http://localhost:8080}
app.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Keep peer hostname verification explicit across mail-library upgrades.
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.structured.format.console=logstash

# Opt-in for private localhost testing only; bootstrap validates URL and CORS boundaries.
app.bootstrap.allow-insecure-local-password=${ALLOW_INSECURE_LOCAL_ADMIN:false}

# Opt-in durable mail. Key ring format: version:standard-base64-32-bytes[,older:...].
app.mail-outbox.enabled=${MAIL_OUTBOX_ENABLED:false}
app.mail-outbox.worker-enabled=${MAIL_OUTBOX_WORKER_ENABLED:true}
app.mail-outbox.active-key-id=${MAIL_OUTBOX_ACTIVE_KEY_ID:}
app.mail-outbox.keys=${MAIL_OUTBOX_KEYS:}
app.mail-outbox.max-pending=${MAIL_OUTBOX_MAX_PENDING:10000}
app.mail-outbox.max-attempts=${MAIL_OUTBOX_MAX_ATTEMPTS:6}
app.mail-outbox.lease-seconds=${MAIL_OUTBOX_LEASE_SECONDS:120}
app.mail-outbox.batch-size=${MAIL_OUTBOX_BATCH_SIZE:10}
app.mail-outbox.poll-millis=${MAIL_OUTBOX_POLL_MILLIS:5000}
