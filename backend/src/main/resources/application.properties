spring.application.name=wordle
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/PGDatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wordle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
server.port=8091
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=520KB
app.timezone=Europe/Istanbul
app.cors-origins=${CORS_ORIGINS:}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
