<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Giriş Yap</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/svgs/solid/gamepad.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-light auth-page">

<!-- Header -->
<header class="brand">
    <h1>Wordle</h1>
    <div class="account-menu">
        <button class="account-btn" id="accountBtn">
            <i class="fa-solid fa-user"></i>
        </button>
        <div class="account-dropdown" id="accountDropdown">
            <ul>
                <li class="guest-only"><a href="login.html"><i class="fa-solid fa-sign-in-alt"></i> Giriş Yap</a></li>
                <li class="guest-only"><a href="register.html"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</a></li>
                <li class="user-info hidden" id="userInfo">
                    <button class="logout-btn"><i class="fa-solid fa-sign-out-alt"></i> Çıkış Yap</button>
                </li>
            </ul>
        </div>
    </div>
</header>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3 text-center">Giriş Yap</h1>

                    <div id="alertContainer"></div>

                    <form id="loginForm" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı Adı</label>
                            <input id="username" type="text" name="username" class="form-control" required autofocus>
                            <div class="invalid-feedback">Kullanıcı adı zorunlu.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Şifre</label>
                            <input id="password" type="password" name="password" class="form-control" required>
                            <div class="invalid-feedback">Şifre zorunlu.</div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Giriş</button>
                    </form>

                    <div class="text-center mt-3">
                        <a class="auth-link" href="register.html">Hesabın yok mu? Kayıt ol</a>
                    </div>
                </div>
            </div>

            <p class="text-center text-muted mt-3 mb-0" style="font-size:.9rem;">
                <a class="auth-link" href="../game.html">↩ Ana sayfaya dön</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
