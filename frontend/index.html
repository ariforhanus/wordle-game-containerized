<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - Choose Language</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/svgs/solid/gamepad.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .lang-select-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .lang-title {
            font-size: 4rem;
            font-weight: 800;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 8px;
        }
        
        .lang-subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
        }
        
        .lang-cards {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .lang-card {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 200px;
        }
        
        .lang-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .lang-card .flag {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .lang-card .lang-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .lang-card .lang-native {
            font-size: 1rem;
            color: #666;
        }
        
        .lang-card.en {
            border-bottom: 5px solid #3b82f6;
        }
        
        .lang-card.tr {
            border-bottom: 5px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="lang-select-page">
        <h1 class="lang-title">WORDLE</h1>
        <p class="lang-subtitle">Choose your language / Dilinizi seçin</p>
        
        <div class="lang-cards">
            <a href="/en/game.html" class="lang-card en">
                <div class="flag">🇬🇧</div>
                <div class="lang-name">English</div>
                <div class="lang-native">Play in English</div>
            </a>
            
            <a href="/tr/game.html" class="lang-card tr">
                <div class="flag">🇹🇷</div>
                <div class="lang-name">Türkçe</div>
                <div class="lang-native">Türkçe oyna</div>
            </a>
        </div>
    </div>
</body>
</html>
