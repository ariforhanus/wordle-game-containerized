<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Wordle - Profilim</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/svgs/solid/user.svg">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="user-page-body">
    <header class="brand">
        <span class="mobile-logo">Wordle</span>
        
        <div class="burger">
            <div></div>
            <div></div>
            <div></div>
        </div>
        
        <div class="desktop-menu">
            <ul>
                <li><a href="game.html"><i class="fa-solid fa-gamepad"></i> Pratik</a></li>
                <li><a href="daily.html"><i class="fa-solid fa-calendar-day"></i> Günlük</a></li>
                <li><a href="leaderboard.html"><i class="fa-solid fa-trophy"></i> Skor Tablosu</a></li>
                <li><a href="/en/user.html"><i class="fa-solid fa-globe"></i> EN</a></li>
            </ul>
        </div>
        
        <a href="user.html" class="account-link" id="accountLink">
            <i class="fa-solid fa-user"></i>
        </a>
        
        <div class="settings-menu">
            <button class="settings-btn" id="settingsBtn">
                <i class="fa-solid fa-gear"></i>
            </button>
            <div class="settings-dropdown" id="settingsDropdown">
                <ul>
                    <li class="guest-only"><a href="auth/login.html"><i class="fa-solid fa-sign-in-alt"></i> Giriş Yap</a></li>
                    <li class="guest-only"><a href="auth/register.html"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</a></li>
                    <li class="user-info hidden" id="userInfo">
                        <button class="logout-btn"><i class="fa-solid fa-sign-out-alt"></i> Çıkış Yap</button>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <nav class="fullscreen-menu hidden">
        <button class="close-menu">&times;</button>
        <ul>
            <li class="auth-section">
                <div class="auth-links">
                    <a href="auth/login.html"><i class="fa-solid fa-sign-in-alt"></i> Giriş Yap</a>
                    <a href="auth/register.html"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</a>
                </div>
                <div class="user-info hidden" id="mobileUserInfo">
                    <button class="logout-btn"><i class="fa-solid fa-sign-out-alt"></i> Çıkış Yap</button>
                </div>
            </li>
            <li><a href="game.html"><i class="fa-solid fa-gamepad"></i> Pratik</a></li>
            <li><a href="daily.html"><i class="fa-solid fa-calendar-day"></i> Günlük Meydan Okuma</a></li>
            <li><a href="leaderboard.html"><i class="fa-solid fa-trophy"></i> Skor Tablosu</a></li>
            <li><a href="/en/user.html"><i class="fa-solid fa-globe"></i> English</a></li>
        </ul>
    </nav>

    <div class="gradient"></div>

    <div class="page user-page">
        <section class="user-page-inner">
            <!-- User Info Section (Top) -->
            <div id="userInfoSection" class="user-info-section">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Stats Section (Bottom) -->
            <div class="user-stats-section">
                <div id="userStatsContainer" class="user-stats-container">
                    <!-- Stats will be injected here by script.js -->
                </div>
            </div>
        </section>
    </div>

    <script src="../js/script.js" defer></script>
</body>

</html>
