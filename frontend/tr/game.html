<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Wordle - Türkçe</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/svgs/solid/gamepad.svg">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="brand">
        <span class="mobile-logo">Wordle</span>
        
        <div class="burger">
            <div></div>
            <div></div>
            <div></div>
        </div>
        
        <div class="desktop-menu">
            <ul>
                <li><a href="game.html"><i class="fa-solid fa-gamepad"></i> Pratik</a></li>
                <li><a href="daily.html"><i class="fa-solid fa-calendar-day"></i> Günlük</a></li>
                <li><a href="leaderboard.html"><i class="fa-solid fa-trophy"></i> Skor Tablosu</a></li>
                <li><a href="/en/game.html"><i class="fa-solid fa-globe"></i> EN</a></li>
            </ul>
        </div>
        
        <a href="user.html" class="account-link" id="accountLink">
            <i class="fa-solid fa-user"></i>
        </a>
        
        <div class="settings-menu">
            <button class="settings-btn" id="settingsBtn">
                <i class="fa-solid fa-gear"></i>
            </button>
            <div class="settings-dropdown" id="settingsDropdown">
                <ul>
                    <li class="guest-only"><a href="auth/login.html"><i class="fa-solid fa-sign-in-alt"></i> Giriş Yap</a></li>
                    <li class="guest-only"><a href="auth/register.html"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</a></li>
                    <li class="user-info hidden" id="userInfo">
                        <button class="logout-btn"><i class="fa-solid fa-sign-out-alt"></i> Çıkış Yap</button>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <nav class="fullscreen-menu hidden">
        <button class="close-menu">&times;</button>
        <ul>
            <li class="auth-section">
                <div class="auth-links">
                    <a href="auth/login.html"><i class="fa-solid fa-sign-in-alt"></i> Giriş Yap</a>
                    <a href="auth/register.html"><i class="fa-solid fa-user-plus"></i> Kayıt Ol</a>
                </div>
                <div class="user-info hidden" id="mobileUserInfo">
                    <button class="logout-btn"><i class="fa-solid fa-sign-out-alt"></i> Çıkış Yap</button>
                </div>
            </li>
            <li><a href="user.html"><i class="fa-solid fa-user"></i> Profilim</a></li>
            <li><a href="game.html"><i class="fa-solid fa-gamepad"></i> Pratik</a></li>
            <li><a href="daily.html"><i class="fa-solid fa-calendar-day"></i> Günlük Meydan Okuma</a></li>
            <li><a href="leaderboard.html"><i class="fa-solid fa-trophy"></i> Skor Tablosu</a></li>
            <li><a href="/en/game.html"><i class="fa-solid fa-globe"></i> English</a></li>
        </ul>
    </nav>

    <div class="gradient"></div>
    <div class="page">
        <section class="loading hidden"><i class="fa-solid fa-circle-notch"></i></section>
        <section class="game">
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
            <div class="letter-box"></div>
        </section>
    </div>

    <div class="hint-popup hidden" id="result-popup" role="dialog" aria-modal="true">
        <div class="hint-content">
            <p class="result-text"></p>
            <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
                <button class="hint-ok-button" id="play-again">Tekrar Oyna</button>
            </div>
        </div>
    </div>

    <section class="keyboard-container">
        <section class="keyboard">
            <div class="keyboard-row">
                <div class="key">E</div>
                <div class="key">R</div>
                <div class="key">T</div>
                <div class="key">Y</div>
                <div class="key">U</div>
                <div class="key">I</div>
                <div class="key">O</div>
                <div class="key">P</div>
                <div class="key">Ğ</div>
                <div class="key">Ü</div>
            </div>
            <div class="keyboard-row">
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
                <div class="key">F</div>
                <div class="key">G</div>
                <div class="key">H</div>
                <div class="key">J</div>
                <div class="key">K</div>
                <div class="key">L</div>
                <div class="key">Ş</div>
                <div class="key">İ</div>
            </div>
            <div class="keyboard-row">
                <div class="key special enter">ENTER</div>
                <div class="key">Z</div>
                <div class="key">C</div>
                <div class="key">V</div>
                <div class="key">B</div>
                <div class="key">N</div>
                <div class="key">M</div>
                <div class="key">Ö</div>
                <div class="key">Ç</div>
                <div class="key special backspace">⌫</div>
            </div>
        </section>
    </section>

    <script src="../js/script.js" defer></script>
</body>

</html>
